name: FourthDownCoach
options:
  bundleIdPrefix: app.fourthdown
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
targets:
  FourthDownCoach:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.fourthdown.coach.freev4
        INFOPLIST_FILE: ios/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "17.4"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: ios/Info.plist
